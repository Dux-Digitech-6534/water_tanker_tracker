[project]
name = "water_tanker_tracker"
authors = [
    { name = "Dux Digitech", email = "durgesh.joshi@thesvsgroup.org"}
]
description = "Record water tanker arrivals with a camera photo, date, time and GPS location"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# The Frappe versions this app runs on. Frappe Cloud (Press) and `bench get-app` read this when the app is added:
# without it they refuse the app ("Could not find a compatible Frappe version in pyproject.toml").
# "-dev" lets nightly / develop benches (15.x-dev, 16.x-dev) match as well as released versions.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev,<17.0.0-dev"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
